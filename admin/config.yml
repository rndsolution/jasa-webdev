backend:
  name: github
  repo: rndsolution/jasa-webdev
  branch: main
  base_url: https://sveltia-cms-auth.rndsolution25.workers.dev/
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "artikel"
    label: "Artikel"
    folder: "content/artikel"
    create: true
    slug: "{{fields.slug}}"
    view_groups:
      - label: "Kategori"
        field: kategori
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Slug URL", name: "slug", widget: "string", hint: "Bagian akhir URL artikel, pendek & mengandung kata kunci. Contoh: biaya-jasa-website" }
      - { label: "Kategori", name: "kategori", widget: "select", options: ["Tips Bisnis", "Tutorial", "Studi Kasus", "Berita"], default: "Tips Bisnis" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Gambar Cover", name: "thumbnail", widget: "image", required: false, media_folder: "/assets/uploads", public_folder: "/assets/uploads" }
      - { label: "Ringkasan (tampil di card blog)", name: "excerpt", widget: "text" }
      - { label: "Meta Description SEO (opsional, kosongkan untuk pakai Ringkasan)", name: "meta_description", widget: "text", required: false }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }

  - name: "halaman"
    label: "Konten Halaman"
    files:
      - label: "Hero Section"
        name: "hero"
        file: "content/hero.json"
        fields:
          - { label: "Badge Text", name: "badge", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Deskripsi", name: "description", widget: "text" }
      - label: "Kontak"
        name: "kontak"
        file: "content/kontak.json"
        fields:
          - { label: "Nomor WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
      - label: "Kalkulator Harga"
        name: "kalkulator"
        file: "content/kalkulator.json"
        fields:
          - label: "Jenis Project"
            name: "jenis_project"
            widget: "list"
            fields:
              - { label: "Nama", name: "nama", widget: "string" }
              - { label: "Slug (unik, tanpa spasi)", name: "slug", widget: "string" }
              - { label: "Harga Dasar", name: "harga_dasar", widget: "number", value_type: "int" }
              - { label: "Deskripsi Singkat", name: "deskripsi", widget: "string" }
          - label: "Fitur Tambahan"
            name: "fitur_tambahan"
            widget: "list"
            fields:
              - { label: "Nama Fitur", name: "nama", widget: "string" }
              - { label: "Harga", name: "harga", widget: "number", value_type: "int" }
